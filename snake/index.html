<!DOCTYPE html>
<!--
  贪吃蛇 Snake
  @author wangrc
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>贪吃蛇 Snake</title>
<style>
  :root {
    --bg: #0e1117;
    --panel: #161b26;
    --line: #242b3a;
    --text: #e6edf3;
    --muted: #8b98ad;
    --accent: #4ade80;
    --accent-dim: #22c55e;
    --food: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #1b2333 0%, var(--bg) 60%);
    color: var(--text);
    font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    user-select: none;
  }
  .wrap { width: 100%; max-width: 560px; }
  header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 12px; flex-wrap: wrap;
  }
  h1 {
    font-size: 18px; margin: 0; letter-spacing: 2px; font-weight: 700;
  }
  h1 span { color: var(--accent); }
  .spacer { flex: 1; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 4px 12px; min-width: 84px;
  }
  .stat i { display: block; font-style: normal; font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .stat b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .stage { position: relative; }
  canvas {
    display: block; width: 100%; height: auto; aspect-ratio: 1 / 1;
    background: #11161f; border: 1px solid var(--line); border-radius: 14px;
    touch-action: none;
  }
  .overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 10px;
    background: rgba(14, 17, 23, .78); border-radius: 14px; backdrop-filter: blur(3px);
    text-align: center; padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 26px; letter-spacing: 3px; }
  .overlay p { margin: 0; color: var(--muted); }
  .overlay .tip { font-size: 12px; }
  .btn {
    margin-top: 6px; padding: 9px 22px; border-radius: 999px; cursor: pointer;
    background: var(--accent); color: #06240f; font-weight: 700; font-size: 15px;
    border: 0; letter-spacing: 1px;
  }
  .btn:hover { background: #6ee79b; }
  .bar {
    display: flex; align-items: center; gap: 14px; margin-top: 12px;
    color: var(--muted); font-size: 12px; flex-wrap: wrap;
  }
  label.sw { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--accent-dim); }
  kbd {
    background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px; font-size: 11px; color: var(--text);
  }
  .pad { display: none; margin-top: 16px; justify-content: center; }
  .pad button {
    width: 60px; height: 60px; margin: 4px; border-radius: 12px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    font-size: 20px; touch-action: none;
  }
  .pad button:active { background: #222b3b; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 60px); }
  @media (pointer: coarse) { .pad { display: flex; } .desktop-tip { display: none; } }
  @media (max-width: 520px) { .desktop-tip { display: none; } .bar { justify-content: center; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>贪吃<span>蛇</span></h1>
    <div class="spacer"></div>
    <div class="stat"><i>得分</i><b id="score">0</b></div>
    <div class="stat"><i>最高</i><b id="best">0</b></div>
  </header>

  <div class="stage">
    <canvas id="cv" width="480" height="480"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">已暂停</h2>
      <p id="ovText">按 空格 继续</p>
      <button class="btn" id="ovBtn">开始游戏</button>
    </div>
  </div>

  <div class="pad">
    <div class="grid3">
      <span></span><button data-dir="up">↑</button><span></span>
      <button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button>
    </div>
  </div>

  <div class="bar">
    <span class="desktop-tip">
      <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>WASD</kbd> 移动 ·
      <kbd>空格</kbd> 暂停 · <kbd>R</kbd> 重开
    </span>
    <span class="spacer"></span>
    <label class="sw"><input type="checkbox" id="wrap" /> 穿墙模式</label>
  </div>
</div>

<script>
(() => {
  'use strict';

  // @author wangrc
  const COLS = 20, ROWS = 20, CELL = 24;
  const BASE_STEP = 145;          // 初始每步毫秒
  const MIN_STEP = 65;            // 最快速度
  const SPEED_UP = 3;             // 每得 1 分缩短的毫秒
  const BEST_KEY = 'snake.best';

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $score = document.getElementById('score');
  const $best = document.getElementById('best');
  const $ov = document.getElementById('ov');
  const $ovTitle = document.getElementById('ovTitle');
  const $ovText = document.getElementById('ovText');
  const $ovBtn = document.getElementById('ovBtn');
  const $wrap = document.getElementById('wrap');

  let snake, prev, dir, queue, food, score, best, state, acc, last, stepMs;

  best = Number(localStorage.getItem(BEST_KEY) || 0);
  $best.textContent = best;

  const rnd = n => Math.floor(Math.random() * n);

  function occupied(x, y) {
    return snake.some(s => s.x === x && s.y === y);
  }

  function placeFood() {
    let x, y, guard = 0;
    do {
      x = rnd(COLS); y = rnd(ROWS);
    } while (occupied(x, y) && ++guard < 1000);
    food = { x, y };
  }

  function reset() {
    const cy = Math.floor(ROWS / 2);
    snake = [
      { x: 5, y: cy },
      { x: 4, y: cy },
      { x: 3, y: cy },
    ];
    prev = snake.map(s => ({ ...s }));
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    stepMs = BASE_STEP;
    acc = 0;
    placeFood();
    $score.textContent = '0';
  }

  // 方向缓冲：避免同一帧内反向 180° 掉头自杀
  function turn(x, y) {
    const lastDir = queue.length ? queue[queue.length - 1] : dir;
    if (lastDir.x === -x && lastDir.y === -y) return;
    if (lastDir.x === x && lastDir.y === y) return;
    if (queue.length < 2) queue.push({ x, y });
  }

  function step() {
    if (queue.length) dir = queue.shift();
    prev = snake.map(s => ({ ...s }));

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if ($wrap.checked) {
      head.x = (head.x + COLS) % COLS;
      head.y = (head.y + ROWS) % ROWS;
    } else if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) {
      return over();
    }

    // 撞到自己（尾巴这一步会移走，所以不算最后一节）
    for (let i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return over();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 1;
      $score.textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem(BEST_KEY, best);
        $best.textContent = best;
      }
      stepMs = Math.max(MIN_STEP, BASE_STEP - score * SPEED_UP);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function over() {
    state = 'over';
    showOverlay('游戏结束', `得分 ${score}${score >= best && score > 0 ? ' · 新纪录 🎉' : ''}`, '再来一局');
  }

  function showOverlay(title, text, btn) {
    $ovTitle.textContent = title;
    $ovText.textContent = text;
    $ovBtn.textContent = btn;
    $ov.classList.add('show');
  }

  function start() {
    reset();
    state = 'running';
    $ov.classList.remove('show');
    last = performance.now();
  }

  function togglePause() {
    if (state === 'running') {
      state = 'paused';
      showOverlay('已暂停', '按 空格 继续', '继续');
    } else if (state === 'paused') {
      state = 'running';
      $ov.classList.remove('show');
      last = performance.now();
    }
  }

  // ---------- 渲染 ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);

    // 棋盘底 + 淡棋格
    ctx.fillStyle = '#11161f';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = 'rgba(255,255,255,.022)';
    for (let y = 0; y < ROWS; y++)
      for (let x = (y % 2); x < COLS; x += 2)
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);

    // 网格线
    ctx.strokeStyle = 'rgba(255,255,255,.055)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) {
      ctx.moveTo(i * CELL + .5, 0); ctx.lineTo(i * CELL + .5, ROWS * CELL);
      ctx.moveTo(0, i * CELL + .5); ctx.lineTo(COLS * CELL, i * CELL + .5);
    }
    ctx.stroke();

    // 食物（呼吸脉动）
    const pulse = 1 + Math.sin(t / 180) * 0.12;
    const fx = (food.x + .5) * CELL, fy = (food.y + .5) * CELL;
    ctx.fillStyle = 'rgba(248,113,113,.18)';
    ctx.beginPath(); ctx.arc(fx, fy, CELL * .52 * pulse, 0, 7); ctx.fill();
    ctx.fillStyle = '#f87171';
    rr(fx - CELL * .32, fy - CELL * .32, CELL * .64, CELL * .64, 7);
    ctx.fill();

    // 蛇身
    for (let i = snake.length - 1; i >= 0; i--) {
      const to = snake[i];
      const from = prev[Math.min(i, prev.length - 1)] || to;
      const gx = from.x + (to.x - from.x) * t;
      const gy = from.y + (to.y - from.y) * t;
      const pad = i === 0 ? 1.5 : 1;
      const x = gx * CELL + pad, y = gy * CELL + pad;
      const s = CELL - pad * 2;

      const ratio = snake.length === 1 ? 0 : 1 - i / snake.length;
      const g = ctx.createLinearGradient(x, y, x + s, y + s);
      if (i === 0) { g.addColorStop(0, '#86efac'); g.addColorStop(1, '#22c55e'); }
      else {
        g.addColorStop(0, `rgba(52,211,96,${.55 + ratio * .4})`);
        g.addColorStop(1, `rgba(21,128,61,${.5 + ratio * .4})`);
      }
      ctx.fillStyle = g;
      rr(x, y, s, s, i === 0 ? 8 : 7);
      ctx.fill();

      // 眼睛
      if (i === 0) {
        ctx.fillStyle = '#06240f';
        const cx = gx * CELL + CELL / 2, cy = gy * CELL + CELL / 2;
        const ex = dir.y !== 0 ? 3.5 : dir.x * 4;
        const ey = dir.x !== 0 ? 3.5 : dir.y * 4;
        ctx.beginPath();
        ctx.arc(cx - ex + dir.y * 2.5, cy - ey + dir.x * 2.5, 1.6, 0, 7);
        ctx.arc(cx + ex + dir.y * 2.5, cy + ey + dir.x * 2.5, 1.6, 0, 7);
        ctx.fill();
      }
    }
  }

  function loop(now) {
    const dt = now - last;
    last = now;
    if (state === 'running') {
      acc += dt;
      let guard = 0;
      while (acc >= stepMs && guard++ < 5) {
        acc -= stepMs;
        if (state !== 'running') break;
        step();
      }
    }
    draw(state === 'running' ? Math.min(acc / stepMs, 1) : 1);
    requestAnimationFrame(loop);
  }

  // ---------- 输入 ----------
  const KEYS = {
    ArrowUp: ['up'], KeyW: ['up'],
    ArrowDown: ['down'], KeyS: ['down'],
    ArrowLeft: ['left'], KeyA: ['left'],
    ArrowRight: ['right'], KeyD: ['right'],
  };
  const VEC = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  function move(name) {
    if (state === 'over') return start();
    if (state === 'ready') return start();
    const [x, y] = VEC[name];
    turn(x, y);
  }

  window.addEventListener('keydown', e => {
    if (KEYS[e.code]) {
      e.preventDefault();
      move(KEYS[e.code][0]);
    } else if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'running' || state === 'paused') togglePause();
      else start();
    } else if (e.code === 'KeyR') {
      start();
    }
  });

  $ovBtn.addEventListener('click', () => {
    if (state === 'paused') togglePause();
    else start();
  });

  document.querySelectorAll('.pad button').forEach(b => {
    b.addEventListener('click', () => move(b.dataset.dir));
  });

  // 滑动手势
  let tx = 0, ty = 0;
  cv.addEventListener('touchstart', e => {
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  cv.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  }, { passive: true });

  cv.addEventListener('click', () => {
    if (state === 'over' || state === 'ready') start();
  });

  // ---------- 启动 ----------
  state = 'ready';
  reset();
  showOverlay('贪吃蛇', '方向键 / WASD / 滑动屏幕', '开始游戏');
  last = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
